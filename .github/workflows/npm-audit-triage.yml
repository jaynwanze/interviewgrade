name: NPM Audit Triage

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  audit-prod:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Enable pnpm
        run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run production dependency audit
        shell: bash
        run: |
          set +e
          pnpm audit --prod --json > audit-prod.json
          status=$?
          echo "pnpm audit exit code: $status"
          cat audit-prod.json
          exit 0

      - name: Upload audit report
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-prod
          path: audit-prod.json
          if-no-files-found: error
          retention-days: 7
