name: Refresh security lockfile

on:
  push:
    branches:
      - security/prune-unused-runtime-deps

permissions:
  contents: write

jobs:
  refresh-lockfile:
    if: ${{ !contains(github.event.head_commit.message, '[lockfile refreshed]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security/prune-unused-runtime-deps
      - name: Enable pnpm
        run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Refresh lockfile
        run: pnpm install --lockfile-only --no-frozen-lockfile
      - name: Remove temporary workflow and commit lockfile
        run: |
          rm .github/workflows/refresh-security-lockfile.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json pnpm-lock.yaml .github/workflows/refresh-security-lockfile.yml
          git commit -m "chore: refresh lockfile [lockfile refreshed]"
          git push origin HEAD:security/prune-unused-runtime-deps
