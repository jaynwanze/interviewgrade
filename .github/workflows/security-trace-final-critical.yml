name: Trace final production critical

on:
  push:
    branches:
      - security/trace-final-critical

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Production audit
        run: pnpm audit --prod --json > audit.json || true
      - name: Print critical advisories
        run: node -e "const a=require('./audit.json'); const advisories=a.advisories||{}; const critical=Object.entries(advisories).filter(([,v])=>v.severity==='critical'); console.log(JSON.stringify(critical,null,2)); console.log('summary',JSON.stringify(a.metadata?.vulnerabilities||{},null,2));"
      - uses: actions/upload-artifact@v4
        with:
          name: final-critical-audit
          path: audit.json
