name: Sharp Override Validation

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  validate-sharp-override:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security/sharp-035-compat-run2

      - name: Enable pnpm
        run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Normalize targeted package changes
        run: |
          pnpm pkg set devDependencies.style-loader='^4.0.0'
          pnpm pkg set pnpm.overrides.sharp=0.35.0
          pnpm install --no-frozen-lockfile

      - name: Verify Sharp resolution
        run: pnpm why sharp

      - name: Typecheck
        run: pnpm tsc

      - name: Build
        continue-on-error: true
        run: pnpm build

      - name: Audit production dependencies
        if: always()
        shell: bash
        run: |
          set +e
          pnpm audit --prod --json > sharp-override-audit.json
          status=$?
          echo "pnpm audit exit code: $status"
          node -e "const a=require('./sharp-override-audit.json'); console.log(JSON.stringify(a.metadata?.vulnerabilities ?? {}, null, 2))"
          exit 0

      - name: Commit validated package and lockfile
        if: always()
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add package.json pnpm-lock.yaml
          git diff --cached --quiet || git commit -m 'security: validate sharp 0.35 override'
          git push origin HEAD:security/sharp-035-compat-run2

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sharp-override-audit
          path: sharp-override-audit.json
          if-no-files-found: error
          retention-days: 7
