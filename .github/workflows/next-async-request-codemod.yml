name: Next 15 Async Request API Codemod

on:
  workflow_dispatch:
  pull_request:
    branches: [master]

jobs:
  codemod:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Enable pnpm
        run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run official Next async-request codemod
        run: npx --yes @next/codemod@canary next-async-request-api . --force
      - name: Show changed files
        run: git diff --name-only
      - name: Persist migration
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src
          git diff --cached --quiet || git commit -m 'refactor: migrate Next async request APIs'
          git pull --rebase origin ${{ github.head_ref }}
          git push origin HEAD:${{ github.head_ref }}
      - name: Typecheck
        run: pnpm tsc
