name: Sharp 0.35 Compatibility

on:
  pull_request:
    branches: [master]

jobs:
  validate-sharp:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Enable pnpm
        run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Upgrade Sharp and refresh lockfile
        run: pnpm add sharp@0.35.0 --save-exact

      - name: Typecheck
        run: pnpm tsc

      - name: Build
        continue-on-error: true
        run: pnpm build

      - name: Audit production dependencies
        shell: bash
        run: |
          set +e
          pnpm audit --prod --json > audit-prod.json
          node -e "const a=require('./audit-prod.json'); console.log(JSON.stringify(a.metadata?.vulnerabilities ?? {}, null, 2))"
          exit 0

      - name: Commit validated dependency files
        shell: bash
        run: |
          if git diff --quiet -- package.json pnpm-lock.yaml; then
            echo "No dependency changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json pnpm-lock.yaml
          git commit -m "security: upgrade sharp to 0.35.0"
          git push

      - name: Upload audit report
        uses: actions/upload-artifact@v4
        with:
          name: sharp-audit
          path: audit-prod.json
          retention-days: 7
