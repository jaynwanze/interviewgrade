name: Security validate TanStack Query upgrade

on:
  push:
    branches:
      - security/validate-tanstack-query-upgrade

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security/validate-tanstack-query-upgrade
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Upgrade TanStack React Query
        run: pnpm add @tanstack/react-query@latest
      - run: pnpm install --frozen-lockfile
      - name: TypeScript validation
        id: tsc
        continue-on-error: true
        run: pnpm exec tsc --noEmit
      - name: Production audit summary
        run: pnpm audit --prod --json > audit.json || true; node -e "const a=require('./audit.json'); console.log(JSON.stringify(a.metadata?.vulnerabilities ?? {}, null, 2))"
      - name: Commit upgrade if compatible
        if: steps.tsc.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json pnpm-lock.yaml
          if git diff --cached --quiet; then
            echo "No dependency changes to commit"
          else
            git commit -m "security: upgrade TanStack React Query"
            git push
          fi
      - name: Fail incompatible upgrade
        if: steps.tsc.outcome != 'success'
        run: exit 1
