name: Security remove unused HTTP/mail deps

on:
  push:
    branches:
      - security/remove-unused-http-mail-deps

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security/remove-unused-http-mail-deps
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm remove axios nodemailer
      - run: pnpm remove -D @types/axios @types/nodemailer
      - run: pnpm install --lockfile-only
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json pnpm-lock.yaml
          if git diff --cached --quiet; then
            echo "No dependency changes to commit"
          else
            git commit -m "security: remove unused axios and nodemailer dependencies"
            git push
          fi
