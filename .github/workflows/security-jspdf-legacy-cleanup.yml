name: Security jsPDF legacy cleanup

on:
  push:
    branches:
      - security/remove-unused-jspdf

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security/remove-unused-jspdf
      - name: Remove legacy jsPDF usage
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/components/Interviews/InterviewHistory/InterviewHistoryDetails.tsx')
          s = p.read_text()
          s = s.replace("import jsPDF from 'jspdf';\n", '')
          s = s.replace("import autoTable from 'jspdf-autotable';\n", '')
          start = s.index('  const generatePDF = () => {')
          end = s.index('  const renderCoach =', start)
          replacement = '''  const generatePDF = () => {\n    if (!isProUser) {\n      setShowPdfUpgrade(true);\n      return;\n    }\n\n    window.print();\n  };\n'''
          s = s[:start] + replacement + s[end:]
          p.write_text(s)
          PY
      - name: Remove temporary workflow
        run: rm .github/workflows/security-jspdf-legacy-cleanup.yml
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json pnpm-lock.yaml src/components/Interviews/InterviewHistory/InterviewHistoryDetails.tsx .github/workflows/security-jspdf-legacy-cleanup.yml
          git commit -m "fix: migrate legacy report export off jsPDF"
          git push origin HEAD:security/remove-unused-jspdf
