name: Security move Tailwind plugins to dev

on:
  push:
    branches:
      - security/move-tailwind-plugins-dev

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security/move-tailwind-plugins-dev
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Move build-only Tailwind plugins to devDependencies
        run: pnpm add -D @headlessui/tailwindcss@0.2.2 @tailwindcss/forms@0.5.11 @tailwindcss/line-clamp@0.4.4 @tailwindcss/typography@0.5.19 tailwindcss-animate@1.0.7
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc --noEmit
      - name: Production audit summary
        run: pnpm audit --prod --json > audit.json || true; node -e "const a=require('./audit.json'); console.log(JSON.stringify(a.metadata?.vulnerabilities ?? {}, null, 2))"
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json pnpm-lock.yaml
          if git diff --cached --quiet; then
            echo "No dependency changes to commit"
          else
            git commit -m "security: keep Tailwind plugins out of production dependencies"
            git push
          fi
