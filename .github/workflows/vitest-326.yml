name: Vitest 3.2.6 Compatibility

on:
  pull_request:
    branches: [master]

jobs:
  validate-vitest:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Enable pnpm
        run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Upgrade Vitest and refresh lockfile
        run: |
          pnpm pkg set devDependencies.vitest='^3.2.6'
          pnpm install --no-frozen-lockfile

      - name: Run unit tests
        run: pnpm test -- --run

      - name: Typecheck
        run: pnpm tsc

      - name: Audit production dependencies
        shell: bash
        run: |
          set +e
          pnpm audit --prod --json > vitest-audit.json
          status=$?
          echo "pnpm audit exit code: $status"
          node -e "const a=require('./vitest-audit.json'); console.log(JSON.stringify(a.metadata?.vulnerabilities ?? {}, null, 2))"
          exit 0

      - name: Persist package and lockfile
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add package.json pnpm-lock.yaml
          git diff --cached --quiet || git commit -m 'security: upgrade vitest to 3.2.6'
          git push origin HEAD:${{ github.head_ref }}

      - name: Upload audit report
        uses: actions/upload-artifact@v4
        with:
          name: vitest-326-audit
          path: vitest-audit.json
          if-no-files-found: error
          retention-days: 7
