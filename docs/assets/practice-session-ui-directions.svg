  <circle cx="92" cy="244" r="15" fill="#1f2030" stroke="#8b5cf6"/><text class="t small" x="118" y="250">Avery · Interviewer</text>
  <text class="m tiny" x="118" y="274">Current question</text>
  <text class="t med" x="88" y="316">Tell me about a time you handled</text><text class="t med" x="88" y="347">a difficult customer situation.</text><text class="t med" x="88" y="378">What did you do, and what was the outcome?</text>
  <rect class="pill" x="88" y="398" width="92" height="28" rx="14"/><text class="m tiny" x="105" y="418">Prep: 30s</text>
  <rect class="pill" x="188" y="398" width="118" height="28" rx="14"/><text class="m tiny" x="205" y="418">Response: 120s</text>
