<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1180" viewBox="0 0 1800 1180">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#09090b"/><stop offset="1" stop-color="#111217"/></linearGradient>
    <radialGradient id="purpleGlow"><stop stop-color="#8b5cf6" stop-opacity=".7"/><stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/></radialGradient>
    <radialGradient id="greenGlow"><stop stop-color="#22c55e" stop-opacity=".55"/><stop offset="1" stop-color="#22c55e" stop-opacity="0"/></radialGradient>
    <radialGradient id="blueGlow"><stop stop-color="#3b82f6" stop-opacity=".62"/><stop offset="1" stop-color="#3b82f6" stop-opacity="0"/></radialGradient>
    <style>
      .bg{fill:url(#bg)} .panel{fill:#0d0e12;stroke:#2a2d35;stroke-width:2}.card{fill:#111216;stroke:#30333c;stroke-width:2}.sub{fill:#17181e;stroke:#30333c}.t{font-family:Inter,Arial,sans-serif;fill:#f5f5f5}.m{font-family:Inter,Arial,sans-serif;fill:#a4a7b2}.tiny{font-size:15px}.small{font-size:18px}.med{font-size:23px;font-weight:600}.big{font-size:34px;font-weight:700}.label{font-size:24px;font-weight:700}.line{stroke:#353843;stroke-width:2}.wave{stroke-linecap:round;stroke-width:5}.btn{fill:#f4f4f5}.btnText{font-family:Inter,Arial,sans-serif;fill:#111;font-size:18px;font-weight:700}.pill{fill:#1b1c22;stroke:#343741}.good{fill:#22c55e}.warn{fill:#f59e0b}.blue{fill:#3b82f6}.purple{fill:#8b5cf6}
    </style>
  </defs>
  <rect class="bg" width="1800" height="1180" rx="24"/>
  <text class="t" x="42" y="52" font-size="30" font-weight="700">Practice Session UI Directions — A / B / C</text>
  <text class="m small" x="42" y="84">Desktop + mobile mockups for tomorrow's selection. Same session logic underneath; only composition changes.</text>

  <!-- column headers -->
  <text class="t label" x="55" y="132">A. Structured landing-page mockup</text>
  <text class="t label" x="625" y="132">B. Light single-stage</text>
  <text class="t label" x="1195" y="132">C. Avery voice-first</text>

  <!-- A desktop -->
